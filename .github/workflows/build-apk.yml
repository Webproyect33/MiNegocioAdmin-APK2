name: Compilar APK Android

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Instalar dependencias
        run: |
          npm install --legacy-peer-deps || npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: 5. Compilar proyecto web Vite
        run: npm run build

      - name: 6. Agregar e inicializar Android con Capacitor
        run: |
          if [ ! -f "capacitor.config.json" ]; then
            echo '{"appId":"com.almacenpro.app","appName":"AlmacenPro","webDir":"dist"}' > capacitor.config.json
          fi
          npx cap add android || true
          npx cap sync android

      - name: 7. Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Subir archivo APK
        uses: actions/upload-artifact@v4
        with:
          name: AlmacenPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
