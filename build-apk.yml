name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Permite ejecutar el workflow manualmente con un clic en GitHub

jobs:
  build-apk:
    name: Compilar APK de AlmacénPro
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Configurar Java JDK (v17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Instalar dependencias web y Capacitor
        run: |
          npm ci || npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: 6. Compilar aplicación web (Vite)
        run: npm run build

      - name: 7. Inicializar y sincronizar Capacitor Android
        run: |
          npx cap init "AlmacenPro" "com.almacenpro.app" --web-dir dist
          npx cap add android || true
          npx cap sync android

      - name: 8. Compilar APK (Debug) con Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 9. Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: AlmacenPro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
